# This is just a name.I can use another name like "Java DUC CI".When I go to:
#GitHub → Actions
#I see:
#Java CI
name: Java CI and Docker CD
# "on:" means : "When should this workflow run"
#This means: Run CI when someone pushes code to the main branch.
on:
  push:
    branches:
      - main
#This means: Run CI when a Pull Request is targeting main branch.
#  This is extremely useful in a team.
#Imagine another developer creates:
#  feature/payment
#and creates:
#  Pull Request → main
#  GitHub Actions automatically tests it.
#If the tests fail:
#  ❌ CI failed
#  the team knows before merging it.
#
  pull_request:
    branches:
      - main
#This means: The workflow can read repository contents.
permissions:
  contents: read
#This means: GitHub should create a temporary Ubuntu machine to execute this job.
#It does NOT mean you need Ubuntu on your Windows computer.I don't need to install Ubuntu
jobs:
  build-and-test-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/dongocduc1984/javaapi-duc-company1

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and run tests
#This means: Compiles the Java application and runs verification and tests
        run: ./mvnw --batch-mode clean verify
#The following is used to create a file "maven-test-reports" to show reports of unit tests.
      - name: Upload Maven test reports
        #if: always() means:
        #Run this step regardless of whether previous steps succeeded or failed.
        if: always()
        uses: actions/upload-artifact@v6
        with:
            name: maven-test-reports
            path: target/surefire-reports/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/dongocduc1984/javaapi-duc-company1:latest
            ghcr.io/dongocduc1984/javaapi-duc-company1:sha-${{ github.sha }}